<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>memechain banner</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  /* Source of docs/readme/banner.png and docs/og.png: python tools/readme_assets.py */
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body { background: radial-gradient(900px 520px at 82% 40%, #17162b 0%, var(--night) 70%); position: relative; }
  .copy { position: absolute; left: 72px; top: 120px; width: 540px; }
  .copy .mark { display: flex; align-items: center; gap: 18px; }
  .copy .mark img { width: 150px; height: 150px; flex: none; margin-left: -12px; }
  .copy h1 { font: 700 98px/1 var(--display); margin: 0; letter-spacing: -.045em; }
  .copy p { font: 600 32px/1.15 var(--sans); margin: 26px 0 0; color: var(--text); letter-spacing: -.02em; }
  .copy small { display: block; margin-top: 18px; font: 500 20px/1.4 var(--sans); color: var(--muted); }
  .copy .url { position: absolute; top: 400px; font: 500 18px/1 var(--mono); color: var(--pepe); }
  .blocks { position: absolute; right: 70px; top: 0; width: 560px; height: 640px; }
  .blocks .cube { position: absolute; --s: 190px; --d: 26px; cursor: default; }
  .blocks .cube .lbl b { font-size: 26px; }
  .blocks .cube .lbl span { font-size: 15px; }
  .c1 { left: 0; top: 330px; } .c2 { left: 186px; top: 214px; } .c3 { left: 372px; top: 98px; }
  .cap { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 2; text-align: center; font: 700 22px/1.05 var(--display); text-transform: uppercase; color: #fff;
    text-shadow: 2px 2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000, -2px -2px 0 #000, 0 2px 0 #000, 2px 0 0 #000, 0 -2px 0 #000, -2px 0 0 #000; }
  .ch { position: absolute; z-index: 3; }
  .peek { width: 86px; left: 474px; top: 34px; z-index: 0; }
  .sit { width: 96px; left: 6px; top: 252px; }
  .doge { width: 120px; left: 330px; top: 470px; z-index: 4; }
</style>
</head>
<body>
  <div class="copy">
    <div class="mark">
      <img src="../logo.png" alt="">
      <h1>memechain</h1>
    </div>
    <p>Every meme gets its own block.</p>
    <small>A proof-of-work blockchain for memes. Mine, inscribe and trade with test tokens in your browser.</small>
    <span class="url">larajeftic.github.io/memechain</span>
  </div>
  <div class="blocks">
    <img class="ch peek" src="../img/characters/pepe-peek.png" alt="">
    <div class="cube c1 meme"><span class="top-f"></span><span class="side-f"></span><span class="face"><img src="../img/doge.jpg" alt=""><span class="lbl"><b>#54</b><span>2 txs</span></span></span></div>
    <div class="cube c2 meme"><span class="top-f"></span><span class="side-f"></span><span class="face"><img src="../img/pepe.jpg" alt="" style="object-position:center 20%"><span class="lbl"><b>#55</b><span>3 txs</span></span></span></div>
    <div class="cube c3 meme"><span class="top-f"></span><span class="side-f"></span><span class="face"><img src="../img/wojak.png" alt=""><span class="cap">he bought the top</span><span class="lbl"><b>#56</b><span>2 txs</span></span></span></div>
    <img class="ch sit" src="../img/characters/pepe-sit.png" alt="">
    <img class="ch doge" src="../img/characters/doge.png" alt="">
  </div>
</body>
</html>
